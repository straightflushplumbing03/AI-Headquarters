name: intelligence-hq

on:
  pull_request:
    paths: ["intelligence-hq/**", ".github/workflows/intelligence-hq.yml"]
  push:
    branches: [main]
    paths: ["intelligence-hq/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: intelligence-hq/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -rs
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: intelligence-hq/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: intelligence-hq/web/package-lock.json }
      - run: npm ci
      - run: npm run build
