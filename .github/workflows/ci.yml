# Continuous integration for AI Headquarters.
#
# Nothing else in this repository runs the test suite on a pull request; the
# jobs-tick workflow only pings the deployed job endpoint. This workflow runs
# the type-check, lint, unit/integration tests and a production build so a
# broken change cannot reach main unverified.
#
# The Supabase live tests (tests/integration/*-live.test.ts) are skipped here:
# they require a dedicated test project and its credentials, which are not
# available to CI. They remain a manual, owner-run gate (`npm run test:live`).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npx vitest run

      - name: Production build
        run: npm run build

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # pgvector-enabled Postgres 16: migration 013 requires the vector extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations to a fresh database and check the schema contracts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/verify
        run: |
          psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          bash scripts/verify-migrations.sh
