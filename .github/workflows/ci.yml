# Continuous integration for AI Headquarters.
#
# Nothing else in this repository runs the test suite on a pull request; the
# jobs-tick workflow only pings the deployed job endpoint. This workflow runs
# the type-check, lint, unit/integration tests and a production build so a
# broken change cannot reach main unverified.
#
# The Supabase live tests (tests/integration/*-live.test.ts) are skipped here:
# they require a dedicated test project and its credentials, which are not
# available to CI. They remain a manual, owner-run gate (`npm run test:live`).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npx vitest run

      - name: Production build
        run: npm run build

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # pgvector-enabled Postgres 16: migration 013 requires the vector extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations to a fresh database and check the schema contracts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/verify
        run: |
          psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          bash scripts/verify-migrations.sh

      # Supabase grants table privileges to the API roles by default (RLS
      # restricts rows); reproduce that, then re-apply the workforce revokes.
      - name: Workforce enforcement suites (permissions, approvals, audit log)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/verify
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q \
            -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO authenticated, service_role; GRANT SELECT ON ALL TABLES IN SCHEMA public TO anon;" \
            -c "SELECT workforce_apply_delegation_privileges();"
          for f in workforce_phase_a_test workforce_delegation_test; do
            psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -f "tests/sql/$f.sql" | tee "/tmp/$f.log"
            grep -q 'ALL CHECKS PASSED' "/tmp/$f.log"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Agent runner end to end (real database, service role)
        env:
          WORKFORCE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/verify
        run: |
          npm ci
          # Alone: the runner takes queued work from every organization, so it must
          # not share the database with another suite running at the same time.
          npx vitest run tests/integration/workforce-runner.test.ts
