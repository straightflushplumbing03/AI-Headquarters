# Frequent worker ticks for /api/jobs/tick.
#
# Vercel Hobby allows cron jobs only once per day (vercel.json runs a daily
# 14:00 UTC tick). This workflow adds a tick every 15 minutes so queued jobs
# (approval sweeps, approved autonomous actions) don't wait a day.
#
# Inert until both repository secrets are set (Settings > Secrets and
# variables > Actions):
#   JOBS_TICK_URL  e.g. https://<production-host>/api/jobs/tick
#   CRON_SECRET    the same value as the Vercel project's CRON_SECRET
# GitHub may delay or skip scheduled runs under load; the endpoint is
# idempotent, so a missed or doubled tick is harmless.
name: jobs-tick

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: jobs-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      JOBS_TICK_URL: ${{ secrets.JOBS_TICK_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Tick
        run: |
          if [ -z "$JOBS_TICK_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "JOBS_TICK_URL / CRON_SECRET not set; skipping."
            exit 0
          fi
          status=$(curl -sS -o /tmp/tick.json -w '%{http_code}' --max-time 90 \
            -X POST "$JOBS_TICK_URL" -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            head -c 500 /tmp/tick.json; echo
            exit 1
          fi
